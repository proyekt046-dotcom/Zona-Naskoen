<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator HPP Zona Naskoen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-amber-50 text-slate-800 p-4" x-data="hppApp()">
    
    <div class="max-w-md mx-auto bg-white p-5 rounded-2xl shadow-md space-y-4 border border-amber-100">
        <div>
            <h1 class="text-base font-bold text-amber-900">📊 Kalkulator HPP Zona Naskoen</h1>
            <p class="text-xs text-gray-500">Hitung modal per porsi & rekomendasi harga jual.</p>
        </div>

        <div class="space-y-3 text-xs">
            <div>
                <label class="font-semibold text-gray-700">Total Modal Bahan (Beras, Ayam, Telur, Bumbu, dll)</label>
                <div class="flex items-center mt-1 border border-amber-200 rounded-lg bg-amber-50/50 px-2">
                    <span class="text-gray-500 font-bold">Rp</span>
                    <input type="number" x-model.number="totalModal" class="w-full p-2.5 bg-transparent font-bold text-amber-900 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="font-semibold text-gray-700">Hasil Jadi (Jumlah Porsi)</label>
                <input type="number" x-model.number="jumlahPorsi" class="w-full p-2.5 border border-amber-200 rounded-lg bg-amber-50/50 font-bold text-amber-900 mt-1 focus:outline-none">
            </div>

            <div>
                <label class="font-semibold text-gray-700">Target Keuntungan (%)</label>
                <input type="number" x-model.number="targetMargin" class="w-full p-2.5 border border-amber-200 rounded-lg bg-amber-50/50 font-bold text-amber-900 mt-1 focus:outline-none">
            </div>

            <div class="bg-amber-100/70 p-4 rounded-xl border border-amber-200 space-y-2 mt-3">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-amber-900">Modal HPP per Porsi:</span>
                    <span class="font-extrabold text-amber-900" x-text="'Rp ' + hppPerPorsi.toLocaleString()"></span>
                </div>
                <div class="flex justify-between items-center border-t border-amber-200/60 pt-2 text-sm">
                    <span class="text-amber-900 font-bold">Rekomendasi Harga Jual:</span>
                    <span class="font-extrabold text-emerald-700 text-base" x-text="'Rp ' + hargaJual.toLocaleString()"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function hppApp() {
            return {
                totalModal: 150000,
                jumlahPorsi: 20,
                targetMargin: 40,
                get hppPerPorsi() {
                    return Math.round(this.totalModal / (this.jumlahPorsi || 1));
                },
                get hargaJual() {
                    return Math.round(this.hppPerPorsi * (1 + this.targetMargin / 100));
                }
            }
        }
    </script>
</body>
</html>
