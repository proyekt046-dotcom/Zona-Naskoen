<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Naskoen Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-amber-50 text-slate-800" x-data="zonaApp()">
    
    <header class="bg-amber-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-3 py-2.5 flex justify-between items-center">
            <h1 class="text-sm font-bold">🟡 Zona Naskoen Pro</h1>
            <span class="bg-emerald-700 text-[10px] px-2 py-0.5 rounded-full font-bold">Online</span>
        </div>
        <nav class="bg-amber-700 px-2 flex gap-1 overflow-x-auto text-xs">
            <button @click="tab = 'pos'" :class="tab === 'pos' ? 'bg-amber-950 font-bold shadow-inner' : ''" class="py-2 px-3 rounded text-white whitespace-nowrap transition">🛒 Kasir</button>
            <button @click="tab = 'hpp'" :class="tab === 'hpp' ? 'bg-amber-950 font-bold shadow-inner' : ''" class="py-2 px-3 rounded text-white whitespace-nowrap transition">📊 HPP</button>
            <button @click="tab = 'stok'" :class="tab === 'stok' ? 'bg-amber-950 font-bold shadow-inner' : ''" class="py-2 px-3 rounded text-white whitespace-nowrap transition">📦 Stok</button>
            <button @click="tab = 'laporan'" :class="tab === 'laporan' ? 'bg-amber-950 font-bold shadow-inner' : ''" class="py-2 px-3 rounded text-white whitespace-nowrap transition">📈 Laporan</button>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto p-3 pb-20">
        
        <!-- 1. KASIR -->
        <div x-show="tab === 'pos'" class="space-y-3">
            <div class="bg-white p-3 rounded-xl shadow-sm">
                <h2 class="text-xs font-bold text-amber-900 mb-2">Pilih Menu</h2>
                <div class="grid grid-cols-2 gap-2">
                    <template x-for="item in menuItems">
                        <div @click="addToCart(item)" class="bg-amber-50 border border-amber-200 p-2.5 rounded-lg active:scale-95 cursor-pointer">
                            <p class="font-bold text-xs text-slate-800" x-text="item.name"></p>
                            <p class="text-xs text-amber-800 font-semibold mt-1" x-text="'Rp ' + item.price.toLocaleString()"></p>
                            <span class="text-[9px] bg-amber-600 text-white px-1.5 py-0.5 rounded mt-1 inline-block">+ Tambah</span>
                        </div>
                    </template>
                </div>
            </div>

            <div class="bg-white p-3 rounded-xl shadow-sm">
                <h2 class="text-xs font-bold text-amber-900 mb-2">Keranjang Pesanan</h2>
                <template x-if="cart.length === 0">
                    <p class="text-[11px] text-gray-400 italic py-2 text-center">Belum ada menu dipilih.</p>
                </template>
                <div class="space-y-2">
                    <template x-for="(c, i) in cart">
                        <div class="flex justify-between items-center border-b pb-1.5 text-xs">
                            <div>
                                <p class="font-bold" x-text="c.name"></p>
                                <p class="text-[10px] text-gray-500" x-text="'Rp ' + (c.price * c.qty).toLocaleString()"></p>
                            </div>
                            <div class="flex items-center gap-1 bg-gray-100 rounded px-1">
                                <button @click="updateQty(i, -1)" class="px-1.5 font-bold">-</button>
                                <span class="font-bold text-xs px-1" x-text="c.qty"></span>
                                <button @click="updateQty(i, 1)" class="px-1.5 font-bold text-amber-700">+</button>
                            </div>
                        </div>
                    </template>
                </div>
                <div class="mt-3 pt-2 border-t flex justify-between items-center text-xs font-bold">
                    <span>Total:</span>
                    <span class="text-amber-700 text-sm" x-text="'Rp ' + totalCart.toLocaleString()"></span>
                </div>
                <button @click="checkout()" class="w-full mt-2.5 bg-emerald-600 text-white py-2 rounded-lg font-bold text-xs">
                    Selesaikan Transaksi (Bayar)
                </button>
            </div>
        </div>

        <!-- 2. HPP -->
        <div x-show="tab === 'hpp'" class="bg-white p-3 rounded-xl shadow-sm space-y-3 text-xs">
            <h2 class="font-bold text-amber-900 text-sm">Kalkulator HPP & Laba</h2>
            <div>
                <label class="font-semibold text-gray-600">Total Modal Bahan (Rp)</label>
                <input type="number" x-model.number="totalModal" class="w-full p-2 border rounded bg-amber-50 mt-1 font-bold">
            </div>
            <div>
                <label class="font-semibold text-gray-600">Jumlah Porsi Jadi</label>
                <input type="number" x-model.number="jumlahPorsi" class="w-full p-2 border rounded bg-amber-50 mt-1 font-bold">
            </div>
            <div class="bg-amber-100 p-3 rounded space-y-1">
                <p>Modal HPP / Porsi: <strong x-text="'Rp ' + Math.round(totalModal / (jumlahPorsi || 1)).toLocaleString()"></strong></p>
                <p class="text-emerald-700 font-bold">Rekomendasi Jual (+40%): <strong x-text="'Rp ' + Math.round((totalModal / (jumlahPorsi || 1)) * 1.4).toLocaleString()"></strong></p>
            </div>
        </div>

        <!-- 3. STOK -->
        <div x-show="tab === 'stok'" class="bg-white p-3 rounded-xl shadow-sm space-y-2 text-xs">
            <h2 class="font-bold text-amber-900 text-sm mb-2">Stok Bahan Baku</h2>
            <template x-for="s in stocks">
                <div class="flex justify-between items-center border-b pb-2">
                    <div>
                        <p class="font-bold" x-text="s.name"></p>
                        <p class="text-[10px] text-gray-500" x-text="'Sisa: ' + s.qty + ' ' + s.unit"></p>
                    </div>
                    <span class="px-2 py-0.5 text-[10px] rounded font-bold" :class="s.qty > 5 ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'" x-text="s.qty > 5 ? 'Aman' : 'Tipis'"></span>
                </div>
            </template>
        </div>

        <!-- 4. LAPORAN -->
        <div x-show="tab === 'laporan'" class="bg-white p-3 rounded-xl shadow-sm space-y-3 text-xs">
            <h2 class="font-bold text-amber-900 text-sm">Laporan Omset Hari Ini</h2>
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-amber-50 p-2.5 rounded border text-center">
                    <p class="text-gray-500 text-[10px]">Total Omset</p>
                    <p class="font-bold text-amber-900 text-sm mt-0.5" x-text="'Rp ' + totalOmset.toLocaleString()"></p>
                </div>
                <div class="bg-amber-50 p-2.5 rounded border text-center">
                    <p class="text-gray-500 text-[10px]">Transaksi</p>
                    <p class="font-bold text-amber-900 text-sm mt-0.5" x-text="totalTransaksi + ' Pesanan'"></p>
                </div>
            </div>
        </div>

    </main>

    <script>
        function zonaApp() {
            return {
                tab: 'pos',
                menuItems: [
                    { id: 1, name: 'Nasi Kuning Royal', price: 25000 },
                    { id: 2, name: 'Nasi Kuning Regular', price: 15000 },
                    { id: 3, name: 'Ayam Goreng', price: 8000 },
                    { id: 4, name: 'Telur Balado', price: 5000 },
                    { id: 5, name: 'Cakalang Suir', price: 7000 },
                    { id: 6, name: 'Es Teh Manis', price: 5000 }
                ],
                cart: [],
                totalModal: 150000,
                jumlahPorsi: 20,
                stocks: [
                    { name: 'Beras Kuning', qty: 15, unit: 'Kg' },
                    { name: 'Ayam Potong', qty: 4, unit: 'Kg' },
                    { name: 'Telur Ayam', qty: 2, unit: 'Tray' },
                    { name: 'Santan', qty: 6, unit: 'Liter' }
                ],
                totalOmset: 0,
                totalTransaksi: 0,
                addToCart(item) {
                    let ex = this.cart.find(i => i.id === item.id);
                    ex ? ex.qty++ : this.cart.push({ ...item, qty: 1 });
                },
                updateQty(i, change) {
                    this.cart[i].qty += change;
                    if (this.cart[i].qty <= 0) this.cart.splice(i, 1);
                },
                get totalCart() {
                    return this.cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
                },
                checkout() {
                    if (this.cart.length === 0) return alert('Keranjang kosong!');
                    this.totalOmset += this.totalCart;
                    this.totalTransaksi++;
                    alert('Transaksi Berhasil Disimpan!');
                    this.cart = [];
                }
            }
        }
    </script>
</body>
</html>
